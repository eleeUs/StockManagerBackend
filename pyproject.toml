[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style  = "double"
indent-style = "space"

[tool.coverage.run]
branch = true
source = ["apps", "core"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "manage.py",
    "config/*",
    "*/management/commands/seed_dev_data.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
skip_covered = false
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
