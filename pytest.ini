[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
; --cov-fail-under=85 calibrated from a stable, fully-green baseline
; (see docs/phase-9-bugfix-plan.md — all 4 bug groups fixed and
; verified, coverage measured at 88.89%). Raise further as coverage
; genuinely improves; don't lower it to make CI pass.
addopts =
    -v --tb=short
    --cov=apps
    --cov=core
    --cov-config=pyproject.toml
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=85
