[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
; --cov-fail-under is a PROVISIONAL floor (50%), not a target.
; Run `make coverage` once, read the real per-app numbers in the
; term-missing report, then raise this to (measured - 2/3 points).
; See docs/phase-9.md for the calibration procedure.
addopts =
    -v --tb=short
    --cov=apps
    --cov=core
    --cov-config=pyproject.toml
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=50
