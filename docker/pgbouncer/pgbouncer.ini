;; pgbouncer.ini — StockManagerBackend
;;
;; Versioned config for the edoburu/pgbouncer image. Mounting this file
;; means the image's own entrypoint (which auto-generates pgbouncer.ini
;; from DATABASE_URL/DB_* env vars when no file exists) is skipped
;; entirely — this file is used as-is. See docs/infra/pgbouncer.md for
;; the sizing rationale and how to read SHOW POOLS / SHOW STATS.
;;
;; Auth: scram-sha-256 with auth_query, NOT a userlist.txt entry per app
;; user. userlist.txt here holds exactly one credential — the
;; "pgbouncer_auth" role pgbouncer itself uses to run the lookup query
;; against pg_shadow. App user passwords are never duplicated on disk.
;; Bootstrap: docker/postgres/initdb/01_pgbouncer_auth.sql.

[databases]
; Single application database. Host/port point at the `db` service
; (Postgres directly), never at pgbouncer itself.
stock_db = host=db port=5432 dbname=stock_db

[pgbouncer]
listen_addr = 0.0.0.0
; edoburu/pgbouncer listens on 5432 by default (to be a transparent
; drop-in) — override explicitly since this stack runs pgbouncer
; alongside Postgres, not instead of it.
listen_port = 6432
unix_socket_dir =

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_query = SELECT * FROM public.user_lookup($1)

;; ---------------------------------------------------------------------
;; Pool sizing
;;
;; default_pool_size is sized for *concurrent write transactions*, not
;; requests/sec: IdempotentMutationMixin (apps/idempotency/mixins.py)
;; wraps every POST /movements/* in one atomic() block for the whole
;; request, so each in-flight mutation holds one server connection for
;; the duration of that request, not just for a single query.
;;
;;   default_pool_size × pools-in-use ≤ Postgres max_connections
;;                                       − superuser_reserved_connections
;;                                       − headroom for direct access
;;                                         (migrations, pg_dump, psql)
;;
;; With Postgres defaults (max_connections=100, superuser_reserved=3)
;; and one pool (one db × one user): 20 default + 5 reserve = 25,
;; leaving 72 for direct/admin access. Re-tune with real numbers once
;; Equipo D's load test has a baseline (docs/infra/load-testing.md).
;; ---------------------------------------------------------------------
pool_mode = transaction
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5

;; max_client_conn bounds api ↔ pgbouncer connections, not
;; pgbouncer ↔ Postgres. With CONN_MAX_AGE=0 (config/settings/production.py)
;; each gunicorn sync worker holds at most one client connection while it
;; is actively handling a request, so this scales with
;; (replicas × gunicorn workers) + margin for health checks, the admin
;; console and cron one-off commands. See gunicorn.conf.py for how
;; `workers` is computed.
max_client_conn = 200

;; Silences a harmless libpq startup parameter Django/psycopg2 sends
;; that older/other pool configs choke on; standard for pgbouncer behind
;; modern psycopg2.
ignore_startup_parameters = extra_float_digits

;; ---------------------------------------------------------------------
;; Timeouts
;;
;; query_wait_timeout MUST stay below gunicorn's `timeout` (30s, see
;; gunicorn.conf.py) — a request stuck waiting for a pooled server
;; connection should get a clean PgBouncer error well before gunicorn
;; SIGKILLs the worker mid-transaction. Default in PgBouncer is 120s,
;; which is too high for this stack.
;; ---------------------------------------------------------------------
query_wait_timeout = 15
server_idle_timeout = 60
server_lifetime = 3600
server_connect_timeout = 10
client_login_timeout = 10

;; ---------------------------------------------------------------------
;; Admin / stats console — used for health checks and SHOW POOLS /
;; SHOW STATS / SHOW CLIENTS (docs/infra/pgbouncer.md). Kept separate
;; from auth_user: the admin console is reached over the same scram
;; auth, so the healthcheck uses pg_isready (no password needed) rather
;; than querying the console directly.
;; ---------------------------------------------------------------------
admin_users = pgbouncer_auth
stats_users = pgbouncer_auth

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
log_stats = 1
stats_period = 60
